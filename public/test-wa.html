<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Bot WhatsApp — Galia Belleza</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #111b21;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Label de entorno */
    .env-label {
      color: #8696a0;
      font-size: 12px;
      margin-bottom: 12px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* Teléfono */
    .phone-wrap {
      width: 390px;
      max-width: 100%;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
      border: 6px solid #1e2d35;
    }

    /* Header WhatsApp */
    .wa-header {
      background: #202c33;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wa-back { color: #aebac1; font-size: 20px; cursor: pointer; }
    .wa-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      padding: 2px;
    }
    .wa-avatar img {
      width: 100%; height: 100%; object-fit: contain; border-radius: 50%;
    }
    .wa-contact { flex: 1; }
    .wa-contact-name { color: #e9edef; font-size: 16px; font-weight: 600; }
    .wa-contact-status { color: #8696a0; font-size: 12px; margin-top: 1px; }
    .wa-icons { display: flex; gap: 20px; color: #aebac1; font-size: 18px; }

    /* Fondo conversación */
    .wa-body {
      background: #0b141a;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23182229' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      height: 500px;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    /* Burbujas */
    .bubble-wrap { display: flex; margin: 2px 0; }
    .bubble-wrap.bot { justify-content: flex-start; }
    .bubble-wrap.user { justify-content: flex-end; }

    .bubble {
      max-width: 75%;
      padding: 8px 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bubble.bot {
      background: #202c33;
      color: #e9edef;
      border-top-left-radius: 0;
    }
    .bubble.user {
      background: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0;
    }
    .bubble-time {
      position: absolute;
      bottom: 5px; right: 10px;
      font-size: 10px;
      color: #8696a0;
    }
    .bubble.user .bubble-time { color: #8ab4ad; }

    /* Typing */
    .typing-bubble {
      background: #202c33;
      border-radius: 8px;
      border-top-left-radius: 0;
      padding: 12px 16px;
      display: flex; gap: 4px; align-items: center;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #8696a0;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Input */
    .wa-input-bar {
      background: #202c33;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wa-input-wrap {
      flex: 1;
      background: #2a3942;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 8px 16px;
      gap: 8px;
    }
    .wa-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e9edef;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
    }
    .wa-input::placeholder { color: #8696a0; }
    .wa-send {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #00a884;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px;
      transition: background .2s;
      flex-shrink: 0;
    }
    .wa-send:hover { background: #008f72; }
    .wa-send:disabled { background: #3b4a54; cursor: default; }

    /* Chips horario */
    .quick-replies {
      background: #111b21;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: #2a3942;
      color: #00a884;
      border: 1px solid #3b4a54;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .chip:hover { background: #3b4a54; }

    /* Badge estado */
    .status-badge {
      margin-top: 12px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .status-badge.ok { background: #d1fae5; color: #065f46; }
    .status-badge.complete { background: #dbeafe; color: #1e40af; }

    /* Links de navegación */
    .nav-links {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .nav-links a {
      color: #00a884;
      text-decoration: none;
    }
    .nav-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <p class="env-label">🧪 Simulador · Bot WhatsApp Galia Belleza</p>

  <div class="phone-wrap">

    <!-- HEADER -->
    <div class="wa-header">
      <a href="/home" class="wa-back" style="text-decoration:none;">‹</a>
      <div class="wa-avatar"><img src="/logo-galia.png" alt="GALia"></div>
      <div class="wa-contact">
        <div class="wa-contact-name">Galia Belleza</div>
        <div class="wa-contact-status" id="statusText">en línea</div>
      </div>
      <div class="wa-icons">
        <span title="Reiniciar conversación" onclick="resetWa()" style="cursor:pointer;font-size:15px;" title="Nueva conversación">🔄</span>
        <span>📹</span>
        <span>📞</span>
      </div>
    </div>

    <!-- MENSAJES -->
    <div class="wa-body" id="waMessages"></div>

    <!-- QUICK REPLIES -->
    <div class="quick-replies">
      <button class="chip" onclick="quickReply('Mañana (9h-13h)')">☀️ Mañana</button>
      <button class="chip" onclick="quickReply('Al mediodía (13h-15h)')">🌤️ Mediodía</button>
      <button class="chip" onclick="quickReply('Por la tarde (15h-19h)')">🌆 Tarde</button>
    </div>

    <!-- INPUT -->
    <div class="wa-input-bar">
      <div class="wa-input-wrap">
        <textarea
          id="waInput"
          class="wa-input"
          placeholder="Escribe un mensaje..."
          rows="1"
        ></textarea>
      </div>
      <button class="wa-send" id="waSend" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <!-- Badge estado -->
  <div id="statusBadge" class="status-badge ok" style="display:none;"></div>

  <!-- Navegación -->
  <div class="nav-links">
    <a href="/">← Agente comercial (web)</a>
    <a href="/panel">Panel de leads</a>
  </div>

  <script>
    let waHistory = [];
    let isComplete = false;

    function getTime() {
      return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function appendBubble(text, role) {
      const container = document.getElementById('waMessages');
      const wrap = document.createElement('div');
      wrap.className = `bubble-wrap ${role}`;
      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;
      const time = document.createElement('span');
      time.className = 'bubble-time';
      time.textContent = getTime() + (role === 'user' ? ' ✓✓' : '');
      bubble.appendChild(time);
      wrap.appendChild(bubble);
      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
      const container = document.getElementById('waMessages');
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap bot';
      wrap.id = 'typing-indicator';
      wrap.innerHTML = `<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
      document.getElementById('typing-indicator')?.remove();
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function quickReply(text) {
      document.getElementById('waInput').value = text;
      sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('waInput');
      const sendBtn = document.getElementById('waSend');
      const message = input.value.trim();
      if (!message || sendBtn.disabled) return;

      input.value = '';
      input.style.height = 'auto';
      appendBubble(message, 'user');

      sendBtn.disabled = true;
      setStatus('escribiendo...');
      showTyping();

      try {
        const res = await fetch('/wa-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history: waHistory })
        });

        const data = await res.json();
        removeTyping();
        setStatus('en línea');

        if (data.reply) {
          // Pequeño delay para simular lectura
          await new Promise(r => setTimeout(r, 400));
          appendBubble(data.reply, 'bot');

          waHistory.push({ role: 'user', content: message });
          waHistory.push({ role: 'assistant', content: data.reply });

          // Si el bot cerró el resumen
          if (data.isComplete) {
            isComplete = true;
            const badge = document.getElementById('statusBadge');
            badge.textContent = '✅ Lead completado — email enviado a info.galiabelleza@gmail.com';
            badge.className = 'status-badge complete';
            badge.style.display = 'block';
          }
        }

      } catch (err) {
        removeTyping();
        setStatus('en línea');
        appendBubble('Lo sentimos, ha habido un error. Inténtalo de nuevo 😊', 'bot');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    // Enter para enviar (Shift+Enter para salto de línea)
    document.getElementById('waInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    document.getElementById('waInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // Reset conversación
    function resetWa() {
      if (!confirm('¿Empezar conversación de cero?')) return;
      waHistory = [];
      isComplete = false;
      document.getElementById('waMessages').innerHTML = '';
      const badge = document.getElementById('statusBadge');
      badge.style.display = 'none';
      badge.className = 'status-badge';
      setStatus('en línea');
      document.getElementById('waInput').value = '';
      document.getElementById('waInput').style.height = 'auto';
      // Saludo inicial del bot
      setTimeout(() => {
        appendBubble('¡Hola! 👋 Soy el asistente de Galia Belleza. ¿En qué puedo ayudarte?', 'bot');
      }, 400);
    }
  </script>

</body>
</html>
